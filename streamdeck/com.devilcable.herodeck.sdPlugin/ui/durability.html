<!doctype html>
<html>
	<head lang="en">
		<title>Durability Settings</title>
		<meta charset="utf-8" />
		<!-- sdpi-components v4.0.1, bundled with the plugin (https://sdpi-components.dev) -->
		<script src="sdpi-components.js"></script>
	</head>

	<body>
		<!--
        Learn more about property inspector components at https://sdpi-components.dev/docs/components
    -->
		<sdpi-item label="Item">
			<sdpi-select setting="item" default="lowest">
				<option value="lowest">Most damaged</option>
				<option value="head">Head</option>
				<option value="shoulders">Shoulders</option>
				<option value="chest">Chest</option>
				<option value="waist">Waist</option>
				<option value="legs">Legs</option>
				<option value="feet">Feet</option>
				<option value="wrists">Wrists</option>
				<option value="hands">Hands</option>
				<option value="mainhand">Main hand</option>
				<option value="offhand">Off hand</option>
				<option value="ranged">Ranged</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Show percentage">
			<sdpi-checkbox setting="showPercent" default></sdpi-checkbox>
		</sdpi-item>
	</body>
</html>
